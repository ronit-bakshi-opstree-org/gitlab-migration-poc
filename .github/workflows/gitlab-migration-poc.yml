name: sainiabhishek619/gitlab-migration-poc
on:
  push:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
env:
  MIGRATION_TEST_BATCH_20261026_122718: 20261026-122718
  MIGRATION_TEST_BATCH_20261026_123115: 20261026-123115
  MIGRATION_TEST_BATCH_20261026_123221: 20261026-123221
  MIGRATION_TEST_BATCH_20261026_123320: 20261026-123320
  MIGRATION_TEST_BATCH_20261026_123611: 20261026-123611
jobs:
  migration-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: test -s README.md
    - run: test "$MIGRATION_TEST_BATCH_20261026_123611" = "20261026-123611"
    - run: echo "Migration smoke test passed"
